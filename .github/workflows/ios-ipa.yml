name: Build iOS IPA (unsigned)

# Buduje NIEPODPISANY plik .ipa na prawdziwym Macu w chmurze GitHuba.
# Pobierz artefakt "KingAi-ipa" i podpisz go u siebie przez Sideloadly (darmowy Apple ID).
# Uruchom ręcznie: zakładka Actions → "Build iOS IPA (unsigned)" → Run workflow.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci || npm install

      - name: Expo prebuild (iOS)
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: npx pod-install

      - name: Build unsigned .app and package .ipa
        working-directory: ios
        run: |
          set -e
          SCHEME=$(xcodebuild -list -workspace KingAi.xcworkspace -json | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d);console.log((j.workspace.schemes||['KingAi'])[0])})")
          echo "Scheme: $SCHEME"
          xcodebuild -workspace KingAi.xcworkspace -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -1)
          echo "App: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r KingAi.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: KingAi-ipa
          path: ios/KingAi.ipa
          if-no-files-found: error
