workflows:
  ios-unsigned-ipa:
    name: KingAi iOS – unsigned IPA
    # Buduje NIEPODPISANY .ipa (bez konta Apple). Podpiszesz go u siebie przez Sideloadly.
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
    scripts:
      - name: Install dependencies
        script: npm ci || npm install
      - name: Expo prebuild (iOS)
        script: npx expo prebuild --platform ios --clean
      - name: Install CocoaPods
        script: npx pod-install
      - name: Build unsigned .app and package .ipa
        script: |
          set -e
          cd ios
          # schemat aplikacji = nazwa jej *.xcodeproj (w ios/ jest tylko projekt aplikacji; Pods.xcodeproj siedzi w Pods/)
          SCHEME=$(ls -d *.xcodeproj | grep -v Pods | head -1 | sed 's/\.xcodeproj$//')
          echo "Scheme: $SCHEME"
          xcodebuild -workspace "$SCHEME.xcworkspace" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -1)
          echo "App: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r KingAi.ipa Payload
    artifacts:
      - ios/KingAi.ipa
